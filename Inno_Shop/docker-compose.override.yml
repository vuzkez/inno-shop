services:
  users-db:
    ports:
      - "1433:1433"        # чтобы подключаться к БД с хоста (SSMS, Azure Data Studio, dotnet run)

  users-redis:
    ports:
      - "6379:6379"        # чтобы подключаться к Redis с хоста (RedisInsight, dotnet run)

  inno_shop.users.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # подробные ошибки в ответах API
