version: '3.8'

services:
  # SQL Server
  users-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: innoshop-users-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  # Redis
  users-redis:
    image: redis:latest
    container_name: innoshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

# Создаем именованные тома для сохранения данных
volumes:
  sql-data:
  redis-data: